<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VolleySmash - Telegram Mini App</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            margin: 0; padding: 0; background-color: #2b0f4c; color: #fff;
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            height: var(--tg-viewport-stable-height, 100vh); 
            width: 100vw; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        
        /* Яскравий аркадний фон */
        #gameContainer {
            position: relative; width: 100vw; height: 100%;
            background: linear-gradient(to bottom, #2b0f4c 0%, #7a1b6c 40%, #d81b60 70%, #ff6f00 100%);
            box-shadow: 0 0 40px #ff007f inset; overflow: hidden;
        }
        
        canvas { display: block; width: 100%; height: 100%; object-fit: fill; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(20, 5, 40, 0.85); z-index: 10;
        }
        
        h1 {
            color: #00e5ff; text-shadow: 4px 4px 0 #ff007f, 0 0 20px #00e5ff;
            font-size: 3.8rem; margin-bottom: 25px; text-align: center; font-weight: 900;
        }
        
        .menu-buttons {
            display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 400px;
        }

        button {
            appearance: none; -webkit-appearance: none;
            background: #ff007f !important; border: 3px solid #00e5ff !important;
            color: #fff !important; padding: 14px 20px; font-size: 1.2rem; font-weight: bold;
            font-family: inherit; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 6px 0 #00e5ff, 0 0 15px rgba(255,0,127,0.5) !important; 
            transition: 0.1s; border-radius: 12px; text-shadow: 1px 1px 0 #000;
        }
        button:active { 
            transform: translateY(6px); box-shadow: 0 0 0 #00e5ff, 0 0 10px rgba(255,0,127,0.5) !important; 
            background: #d81b60 !important; 
        }
        
        .btn-white { 
            background: #00e5ff !important; border-color: #ffea00 !important; color: #000 !important; 
            box-shadow: 0 6px 0 #ffea00 !important; text-shadow: none;
        }
        .btn-white:active { background: #00b8cc !important; box-shadow: 0 0 0 #ffea00 !important; }
        
        .hidden { display: none !important; }

        #btnInGameMenu, #btnPause {
            position: absolute; top: 15px; padding: 8px 16px; font-size: 1rem; z-index: 8; 
            border-color: #00e5ff !important; color: #fff !important;
            background: rgba(255, 0, 127, 0.8) !important; box-shadow: 0 4px 0 #00e5ff !important;
        }
        #btnInGameMenu:active, #btnPause:active { transform: translateY(4px); box-shadow: 0 0 0 #00e5ff !important; }
        #btnInGameMenu { left: 15px; } #btnPause { right: 15px; }
        
        /* Збільшені та яскраві статичні кнопки управління */
        .controls-container {
            position: absolute; bottom: 15px; left: 0; width: 100%;
            display: flex; padding: 0 4%; box-sizing: border-box; z-index: 5;
            justify-content: space-between; pointer-events: none;
        }
        
        .left-right-group { display: flex; gap: 20px; pointer-events: auto; }

        .touch-btn {
            pointer-events: auto; width: 22vh; height: 22vh; /* Збільшено на 20% */
            min-width: 95px; min-height: 95px; max-width: 150px; max-height: 150px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 5vh; font-weight: bold; user-select: none; 
            background: rgba(0, 229, 255, 0.2); border: 4px solid #00e5ff; 
            color: #fff; text-shadow: 2px 2px 0 #ff007f;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4) inset, 0 5px 15px rgba(0,0,0,0.3);
            transition: background 0.1s;
        }
        
        #btnJumpP1 { pointer-events: auto; }

        #rotatePrompt {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #2b0f4c; color: #00e5ff; z-index: 100; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; text-shadow: 2px 2px 0 #ff007f;
        }
        @media (orientation: portrait) {
            #rotatePrompt { display: flex; } #gameContainer { display: none; }
        }

        #roomCodeInput {
            padding: 12px; font-size: 1.5rem; text-align: center; text-transform: uppercase;
            font-weight: 900; background: #fff; border: 4px solid #ff007f; color: #2b0f4c;
            border-radius: 12px; font-family: inherit; outline: none; box-shadow: 0 0 15px #ff007f;
        }

        @media (max-height: 450px) {
            h1 { font-size: 2.5rem; margin-bottom: 10px; }
            .menu-buttons { gap: 10px; }
            button { padding: 10px 16px; font-size: 1rem; box-shadow: 0 4px 0 #00e5ff !important; }
            button:active { transform: translateY(4px); }
            .btn-white { box-shadow: 0 4px 0 #ffea00 !important; }
        }
    </style>
</head>
<body>

<div id="rotatePrompt">
    <h2>Переверніть пристрій 🔄</h2>
    <p>Гра оптимізована для горизонтального екрану</p>
</div>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <button id="btnInGameMenu" class="hidden" onclick="returnToMenu()">Меню</button>
    <button id="btnPause" class="hidden" onclick="togglePause()">⏸</button>

    <div id="menuScreen" class="overlay">
        <h1>VOLLEY SMASH</h1>
        
        <div class="menu-buttons" id="mainMenuBtns">
            <button onclick="showDifficulty()">Грати проти ШІ (PvE)</button>
            <button class="btn-white" onclick="showOnlineMenu()">Онлайн Гра з другом</button>
        </div>
        
        <div class="menu-buttons hidden" id="diffMenuBtns">
            <button onclick="startGame('ai', 'easy')">Легко</button>
            <button onclick="startGame('ai', 'normal')">Нормально</button>
            <button onclick="startGame('ai', 'hard')">Важко</button>
            <button class="btn-white" onclick="hideDifficulty()">← Назад</button>
        </div>

        <div class="menu-buttons hidden" id="onlineMenuBtns">
            <button onclick="createRoom()">Створити кімнату</button>
            <button onclick="showJoinMenu()">Увійти за кодом</button>
            <button class="btn-white" onclick="hideOnlineMenu()">← Назад</button>
        </div>

        <div class="menu-buttons hidden" id="joinMenuBtns">
            <input type="text" id="roomCodeInput" placeholder="Код (AX55)" maxlength="5">
            <button onclick="joinRoom()">Підключитись</button>
            <button class="btn-white" onclick="hideJoinMenu()">← Назад</button>
        </div>
    </div>

    <div id="pauseScreen" class="overlay hidden">
        <h1>ПАУЗА</h1>
        <div class="menu-buttons">
            <button onclick="togglePause()">Продовжити</button>
            <button class="btn-white" onclick="returnToMenu()">В Головне Меню</button>
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 id="winnerText">WINNER!</h1>
        <p id="finalScore" style="font-size: 1.5rem; margin-bottom: 25px; color: #ffea00; font-weight: bold; text-shadow: 2px 2px 0 #ff007f; text-align: center;"></p>
        <button onclick="returnToMenu()">В Головне Меню</button>
    </div>

    <!-- Статичні збільшені кнопки -->
    <div id="controlsP1" class="controls-container hidden">
        <div class="left-right-group">
            <div class="touch-btn" id="btnLeftP1">←</div>
            <div class="touch-btn" id="btnRightP1">→</div>
        </div>
        <div class="touch-btn" id="btnJumpP1">↑</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand(); 
    tg.ready();  

    const socket = io();
    let myRole = null; 
    let roomId = null; 

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let shakeFrames = 0;
    let lastTime = 0; 

    // --- 8-BIT АУДІО СИСТЕМА ---
    let audioCtx = null; 
    let bgmStarted = false;
    let bgmStep = 0;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playNote(freq, type, startTime, duration, vol) {
        if(!audioCtx) return; 
        const osc = audioCtx.createOscillator(); 
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, startTime); 
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime); osc.stop(startTime + duration);
    }

    // Безперервний фоновий 8-бітний саундтрек
    function startContinuousBGM() {
        if (bgmStarted) return;
        initAudio();
        bgmStarted = true;
        
        // Ретро 8-бітна мелодія
        const melody = [
            392.00, 392.00, 587.33, 587.33, 659.25, 659.25, 587.33, 0, // G G D D E E D
            523.25, 523.25, 493.88, 493.88, 440.00, 440.00, 392.00, 0, // C C B B A A G
            587.33, 587.33, 523.25, 523.25, 493.88, 493.88, 440.00, 0, // D D C C B B A
            587.33, 587.33, 523.25, 523.25, 493.88, 493.88, 440.00, 0  // D D C C B B A
        ];
        const bass = [
            196.00, 196.00, 196.00, 196.00, // G
            130.81, 130.81, 130.81, 130.81, // C
            146.83, 146.83, 146.83, 146.83, // D
            146.83, 146.83, 146.83, 146.83  // D
        ];

        setInterval(() => {
            if(audioCtx && audioCtx.state === 'running') {
                // Мелодія (Square wave - класика 8-біт)
                let freq = melody[bgmStep % melody.length];
                if (freq > 0) playNote(freq, 'square', audioCtx.currentTime, 0.15, 0.05);
                
                // Бас-лінія 
                if (bgmStep % 2 === 0) {
                    let bassFreq = bass[Math.floor((bgmStep % melody.length) / 8)];
                    playNote(bassFreq, 'square', audioCtx.currentTime, 0.25, 0.07);
                }
                bgmStep++;
            }
        }, 180); // Темп музики
    }

    // Запуск музики при будь-якому дотику до екрана
    window.addEventListener('touchstart', startContinuousBGM, {once:true});
    window.addEventListener('mousedown', startContinuousBGM, {once:true});

    // Ігрові звукові ефекти
    function playSound(type) {
        if (!audioCtx) return; const now = audioCtx.currentTime;
        if (type === 'jump') { playNote(300, 'square', now, 0.15, 0.1); playNote(450, 'square', now+0.05, 0.1, 0.05); } 
        else if (type === 'hit') { playNote(800, 'square', now, 0.1, 0.15); playNote(1200, 'square', now+0.05, 0.1, 0.1); } 
        else if (type === 'smash') { playNote(200, 'sawtooth', now, 0.15, 0.3); playNote(100, 'sawtooth', now, 0.2, 0.3); } 
        else if (type === 'wall') { playNote(250, 'triangle', now, 0.1, 0.1); } 
        else if (type === 'score') { playNote(400, 'square', now, 0.4, 0.2); playNote(300, 'square', now+0.1, 0.3, 0.2); tg.HapticFeedback.notificationOccurred('success'); } 
        else if (type === 'set_win') { playNote(500, 'square', now, 0.15, 0.1); playNote(650, 'square', now + 0.15, 0.3, 0.1); tg.HapticFeedback.notificationOccurred('success'); } 
        else if (type === 'match_win') { playNote(523, 'square', now, 0.15, 0.15); playNote(659, 'square', now + 0.15, 0.15, 0.15); playNote(783, 'square', now + 0.30, 0.15, 0.15); playNote(1046, 'square', now + 0.45, 0.4, 0.15); tg.HapticFeedback.notificationOccurred('success'); } 
        else if (type === 'whistle') {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'square';
            osc.frequency.setValueAtTime(1500, now); osc.frequency.linearRampToValueAtTime(2000, now + 0.3);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    socket.on('playerRole', (role) => { myRole = role; });

    socket.on('gameReady', () => {
        document.getElementById('winnerText').innerText = "";
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('controlsP1').classList.remove('hidden');
        document.getElementById('btnInGameMenu').classList.remove('hidden');
        document.getElementById('btnPause').classList.remove('hidden');
        
        p1.isAI = false; p2.isAI = false; 
        score = { p1: 0, p2: 0 }; sets = { p1: 0, p2: 0 };
        p1.x = p1.startX; p2.x = p2.startX; p1.radius = p1.baseRadius; p2.radius = p2.baseRadius;
        particles = []; ball.reset(1); gameState = 'playing'; playSound('whistle'); 
    });

    socket.on('updateOpponent', (data) => {
        let opp = data.role === 'p1' ? p1 : p2;
        opp.targetX = data.x; opp.targetY = data.y; 
        opp.tilt = data.tilt; opp.squash = data.squash; opp.stretch = data.stretch;
    });

    socket.on('updateBall', (data) => {
        if (myRole === 'p2') { ball.targetX = data.x; ball.targetY = data.y; ball.vx = data.vx; ball.vy = data.vy; }
    });

    socket.on('syncState', (data) => {
        if (myRole === 'p2') {
            score = data.score; sets = data.sets; p1.radius = data.p1Radius; p2.radius = data.p2Radius;
            if (data.sound) playSound(data.sound);
            if (data.shake) shakeFrames = data.shake;
            if (data.isGameOver) checkMatchWin(data.winner);
        }
    });
    
    socket.on('gameEvent', (data) => {
        if (myRole === 'p2') {
            if (data.type === 'hit' || data.type === 'smash') { 
                playSound(data.type); 
                if (data.type === 'smash') { shakeFrames = 15; tg.HapticFeedback.impactOccurred('heavy'); } 
                else { tg.HapticFeedback.impactOccurred('medium'); }
                let p = data.pName === 'p1' ? p1 : p2; p.hitTimer = 5; spawnDust(ball.x, ball.y + ball.radius, data.type === 'smash' ? 15 : 5, '#ffea00'); 
            }
            if (data.type === 'wall') playSound('wall');
            if (data.type === 'jump') { playSound('jump'); let p = data.pName === 'p1' ? p1 : p2; spawnDust(p.x, p.y + p.radius, 10, '#00e5ff'); }
        }
    });

    let particles = [];
    class Dust {
        constructor(x, y, color) { 
            this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 6; this.vy = Math.random() * -4; 
            this.life = 1.0; this.size = Math.random() * 8 + 4; this.color = color;
        }
        update(timeScale) { this.x += this.vx * timeScale; this.y += this.vy * timeScale; this.life -= 0.05 * timeScale; }
        draw() { 
            ctx.fillStyle = this.color; ctx.globalAlpha = this.life;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }
    function spawnDust(x, y, count=10, color='#fff') { for(let i=0; i<count; i++) particles.push(new Dust(x, y, color)); }

    const GRAVITY = 0.6; const PTS_TO_WIN_SET = 7; const SETS_TO_WIN_MATCH = 3;
    let gameState = 'menu'; let difficulty = 'normal';
    let score = { p1: 0, p2: 0 }; let sets = { p1: 0, p2: 0 };
    const net = { x: 395, y: 250, width: 10, height: 200 };

    class Player {
        constructor(x, color, isAI = false) {
            this.startX = x; this.x = x; this.y = 350; this.targetX = x; this.targetY = 350;
            this.baseRadius = 45; this.radius = this.baseRadius;
            this.vx = 0; this.vy = 0; this.jumpPower = -12; this.color = color; this.isAI = isAI; this.isGrounded = true;
            this.speed = 6.0; this.squash = 1; this.stretch = 1; this.tilt = 0; this.hitTimer = 0;
            this.jumpCooldown = 0; 
        }

        updateAI(ball, timeScale) {
            let aiSpeed = 5.0; let reactionDistance = 70; let jumpChance = 1;
            if (difficulty === 'easy') { aiSpeed = 3.5; reactionDistance = 50; jumpChance = 0.5; } 
            else if (difficulty === 'hard') { aiSpeed = 7.0; reactionDistance = 100; jumpChance = 1; }
            
            if (this.jumpCooldown > 0) this.jumpCooldown -= timeScale;

            if (ball.x > 400) { 
                if (this.x < ball.x - 5) this.vx = aiSpeed; else if (this.x > ball.x + 5) this.vx = -aiSpeed; else this.vx = 0;
                
                if (ball.vy > 0 && ball.y > 100 && ball.y < 340 && this.isGrounded && Math.abs(this.x - ball.x) < reactionDistance) {
                    if (this.jumpCooldown <= 0 && Math.random() <= jumpChance) { 
                        this.vy = this.jumpPower; this.isGrounded = false; 
                        spawnDust(this.x, this.y + this.radius, 10, '#ff007f'); playSound('jump'); 
                        this.jumpCooldown = 45; 
                    }
                }
            } else { 
                if (this.x < 550) this.vx = aiSpeed; else if (this.x > 570) this.vx = -aiSpeed; else this.vx = 0; 
            }
        }

        update(ball, isLocalControl, timeScale) {
            if (this.isAI && isLocalControl) this.updateAI(ball, timeScale);
            
            if (isLocalControl || this.isAI) {
                let currentGravity = GRAVITY;
                if (!this.isGrounded && Math.abs(this.vy) < 2.5) { currentGravity *= 0.55; }

                this.vy += currentGravity * timeScale; 
                this.x += this.vx * timeScale; 
                this.y += this.vy * timeScale; 
                this.tilt = this.vx * 0.03;
                
                if (!this.isGrounded) { this.stretch = 1.1; this.squash = 0.9; } 
                else { this.stretch += (1 - this.stretch) * 0.2; this.squash += (1 - this.squash) * 0.2; }
                if (this.hitTimer > 0) { this.stretch = 0.8; this.squash = 1.2; this.hitTimer -= timeScale; }
                
                if (this.y + this.radius >= canvas.height) {
                    if (!this.isGrounded && this.vy > 5) { spawnDust(this.x, canvas.height, 10, '#fff'); this.stretch = 0.8; this.squash = 1.2; }
                    this.y = canvas.height - this.radius; this.vy = 0; this.isGrounded = true;
                } else { this.isGrounded = false; }
                
                if (this.x < net.x) { if (this.x - this.radius < 0) this.x = this.radius; if (this.x + this.radius > net.x) this.x = net.x - this.radius; } 
                else { if (this.x - this.radius < net.x + net.width) this.x = net.x + net.width + this.radius; if (this.x + this.radius > canvas.width) this.x = canvas.width - this.radius; }
            } else {
                this.x += (this.targetX - this.x) * 0.4 * timeScale;
                this.y += (this.targetY - this.y) * 0.4 * timeScale;
            }
        }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.tilt); if (this.startX < 400) ctx.scale(-1, 1);
            ctx.scale(this.squash, this.stretch); 
            
            // Яскравий неоновий персонаж
            ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
            ctx.fillStyle = this.color; ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
            
            // Око
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(15, -10, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(20, -10, 4, 0, Math.PI*2); ctx.fill();
            
            // Дзьоб
            ctx.fillStyle = '#ffea00'; ctx.beginPath(); ctx.moveTo(25, 0); ctx.lineTo(45, 5); ctx.lineTo(25, 10); ctx.fill();
            ctx.restore();
        }
    }

    class Ball {
        constructor() { this.radius = 22; this.rotation = 0; this.lastHitter = null; this.crossedNet = false; this.trail = []; this.reset(1); }
        reset(server) { this.x = server === 1 ? 200 : 600; this.y = 80; this.targetX = this.x; this.targetY = this.y; this.vx = 0; this.vy = 0; this.speedMultiplier = 1; this.lastHitter = null; this.crossedNet = false; this.trail = []; }

        update(p1, p2, isHost, timeScale) {
            if (isHost) { 
                this.vy += GRAVITY * 0.46 * timeScale; 
                this.x += this.vx * timeScale; 
                this.y += this.vy * timeScale; 
            } else {
                this.x += (this.targetX - this.x) * 0.5 * timeScale;
                this.y += (this.targetY - this.y) * 0.5 * timeScale;
            }

            let speed = Math.abs(this.vx) + Math.abs(this.vy);
            if (speed > 10) { this.trail.push({x: this.x, y: this.y}); if (this.trail.length > 8) this.trail.shift(); } else if (this.trail.length > 0) { this.trail.shift(); }

            if (isHost) {
                if (this.lastHitter === p1 && !this.crossedNet && this.x > net.x + net.width) { this.crossedNet = true; p1.radius *= 1.1; } 
                else if (this.lastHitter === p2 && !this.crossedNet && this.x < net.x) { this.crossedNet = true; p2.radius *= 1.1; }

                if (this.x - this.radius <= 0) { this.x = this.radius; this.vx *= -0.95; playSound('wall'); if(myRole) socket.emit('gameEvent', {roomId, type: 'wall'}); }
                if (this.x + this.radius >= canvas.width) { this.x = canvas.width - this.radius; this.vx *= -0.95; playSound('wall'); if(myRole) socket.emit('gameEvent', {roomId, type: 'wall'}); }
                if (this.y - this.radius <= 0) { this.y = this.radius; this.vy *= -0.95; playSound('wall'); if(myRole) socket.emit('gameEvent', {roomId, type: 'wall'}); }
                if (this.x + this.radius > net.x && this.x - this.radius < net.x + net.width && this.y + this.radius > net.y) {
                    if (this.y < net.y + 10) { this.vy *= -0.95; this.y = net.y - this.radius; playSound('wall'); if(myRole) socket.emit('gameEvent', {roomId, type: 'wall'}); } 
                    else { this.vx *= -1; this.x = this.x < net.x ? net.x - this.radius : net.x + net.width + this.radius; playSound('wall'); if(myRole) socket.emit('gameEvent', {roomId, type: 'wall'}); }
                }
                
                if (this.y + this.radius >= canvas.height) {
                    playSound('whistle'); shakeFrames = 10;
                    let sndToPlay = 'score'; let isGameOver = false; let winner = ''; let nextServer = 1;
                    if (this.x < net.x) { score.p2++; nextServer = 1; } else { score.p1++; nextServer = 2; }
                    if (score.p1 >= PTS_TO_WIN_SET || score.p2 >= PTS_TO_WIN_SET) {
                        if (score.p1 > score.p2) sets.p1++; else sets.p2++; score.p1 = 0; score.p2 = 0;
                        if (sets.p1 >= SETS_TO_WIN_MATCH || sets.p2 >= SETS_TO_WIN_MATCH) { sndToPlay = 'match_win'; isGameOver = true; winner = sets.p1 >= SETS_TO_WIN_MATCH ? 'p1' : 'p2'; } else { sndToPlay = 'set_win'; }
                    }
                    playSound(sndToPlay); this.reset(nextServer);
                    p1.x = p1.startX; p1.y = 350; p1.radius = p1.baseRadius; p2.x = p2.startX; p2.y = 350; p2.radius = p2.baseRadius;
                    if (myRole === 'p1') { socket.emit('syncState', { roomId, score, sets, p1Radius: p1.radius, p2Radius: p2.radius, sound: sndToPlay, shake: 10, isGameOver, winner }); }
                    if (isGameOver) { checkMatchWin(winner); return; }
                }
                this.checkPlayerCollision(p1); this.checkPlayerCollision(p2);
            }
        }

        checkPlayerCollision(p) {
            let dx = this.x - p.x; let dy = this.y - p.y; let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < this.radius + p.radius) {
                let isSmash = !p.isGrounded && Math.abs(p.vy) < 3.5 && this.y < p.y - 10;
                let bounceForce = isSmash ? 17 : 12; 
                let angle = Math.atan2(dy, dx); 
                this.vx = Math.cos(angle) * bounceForce; this.vy = Math.sin(angle) * bounceForce; 
                
                if (this.vy > 0 && !isSmash) this.vy = -this.vy - 3;
                else if (isSmash && this.vy > 0) this.vy = Math.max(this.vy, 5); 
                
                this.speedMultiplier += 0.05; this.vx *= this.speedMultiplier; this.vy *= this.speedMultiplier;
                
                let overlap = (this.radius + p.radius) - distance; this.x += Math.cos(angle) * overlap; this.y += Math.sin(angle) * overlap;
                this.lastHitter = p; this.crossedNet = false; p.hitTimer = 5; 
                
                let hitType = isSmash ? 'smash' : 'hit';
                playSound(hitType); spawnDust(this.x, this.y + this.radius, isSmash ? 20 : 5, '#ffea00');
                if (isSmash) { shakeFrames = 15; tg.HapticFeedback.impactOccurred('heavy'); } 
                else { tg.HapticFeedback.impactOccurred('medium'); }
                if (myRole === 'p1') socket.emit('gameEvent', { roomId, type: hitType, pName: p === p1 ? 'p1' : 'p2' });
            }
        }

        draw() {
            for(let i=0; i<this.trail.length; i++) {
                let t = this.trail[i]; let ratio = (i + 1) / this.trail.length;
                ctx.beginPath(); ctx.arc(t.x, t.y, this.radius * ratio, 0, Math.PI*2); 
                ctx.fillStyle = `rgba(255, 234, 0, ${0.5 * ratio})`; ctx.fill();
            }
            ctx.save(); ctx.translate(this.x, this.y); this.rotation += this.vx * 0.05; ctx.rotate(this.rotation);
            ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); 
            ctx.fillStyle = '#ffea00'; ctx.shadowBlur = 30; ctx.shadowColor = '#ffea00'; 
            ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
            
            // Візерунок м'яча
            ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-15, -10); ctx.lineTo(15, 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-15, 10); ctx.lineTo(15, -10); ctx.stroke();
            ctx.restore();
        }
    }

    let p1 = new Player(150, '#ff007f'); let p2 = new Player(650, '#00e5ff', true); let ball = new Ball();
    const keys = { a: false, d: false, w: false };

    window.addEventListener('keydown', (e) => {
        let k = e.key; let pRef = (myRole === 'p2') ? p2 : p1;
        if (k==='a' || k==='A' || k==='ф' || k==='Ф' || e.code === 'ArrowLeft') keys.a = true;
        if (k==='d' || k==='D' || k==='в' || k==='В' || e.code === 'ArrowRight') keys.d = true;
        if (k==='w' || k==='W' || k==='ц' || k==='Ц' || e.code === 'ArrowUp') { 
            keys.w = true; 
            if (pRef.isGrounded && gameState === 'playing') {
                pRef.vy = pRef.jumpPower; pRef.isGrounded = false; spawnDust(pRef.x, pRef.y + pRef.radius, 10, '#00e5ff'); playSound('jump');
                if(myRole) socket.emit('gameEvent', { roomId, type: 'jump', pName: myRole });
            }
        }
    });
    window.addEventListener('keyup', (e) => {
        let k = e.key;
        if (k==='a' || k==='A' || k==='ф' || k==='Ф' || e.code === 'ArrowLeft') keys.a = false;
        if (k==='d' || k==='D' || k==='в' || k==='В' || e.code === 'ArrowRight') keys.d = false;
        if (k==='w' || k==='W' || k==='ц' || k==='Ц' || e.code === 'ArrowUp') keys.w = false;
    });

    // --- ПРИВ'ЯЗКА СТАТИЧНИХ КНОПОК ---
    const addTouch = (id, key) => {
        const btn = document.getElementById(id);
        const startAction = (e) => { 
            e.preventDefault(); if(gameState !== 'playing') return;
            keys[key] = true; let pRef = (myRole === 'p2') ? p2 : p1;
            if(key==='w' && pRef.isGrounded) {
                pRef.vy = pRef.jumpPower; pRef.isGrounded = false; spawnDust(pRef.x, pRef.y + pRef.radius, 10, '#00e5ff'); playSound('jump');
                if(myRole) socket.emit('gameEvent', { roomId, type: 'jump', pName: myRole });
            }
            btn.style.background = 'rgba(0, 229, 255, 0.6)';
        };
        const endAction = (e) => { e.preventDefault(); keys[key] = false; btn.style.background = 'rgba(0, 229, 255, 0.2)'; };
        
        btn.addEventListener('touchstart', startAction, {passive: false});
        btn.addEventListener('touchend', endAction, {passive: false});
        btn.addEventListener('touchcancel', endAction, {passive: false});
    };

    addTouch('btnLeftP1', 'a'); addTouch('btnRightP1', 'd'); addTouch('btnJumpP1', 'w');

    // Логіка меню
    function showDifficulty() { document.getElementById('mainMenuBtns').classList.add('hidden'); document.getElementById('diffMenuBtns').classList.remove('hidden'); }
    function hideDifficulty() { document.getElementById('mainMenuBtns').classList.remove('hidden'); document.getElementById('diffMenuBtns').classList.add('hidden'); }
    function showOnlineMenu() { document.getElementById('mainMenuBtns').classList.add('hidden'); document.getElementById('onlineMenuBtns').classList.remove('hidden'); }
    function hideOnlineMenu() { document.getElementById('mainMenuBtns').classList.remove('hidden'); document.getElementById('onlineMenuBtns').classList.add('hidden'); }
    function showJoinMenu() { document.getElementById('onlineMenuBtns').classList.add('hidden'); document.getElementById('joinMenuBtns').classList.remove('hidden'); }
    function hideJoinMenu() { document.getElementById('onlineMenuBtns').classList.remove('hidden'); document.getElementById('joinMenuBtns').classList.add('hidden'); }

    function generateRoomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code = '';
        for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        return code;
    }

    function createRoom() {
        initAudio(); myRole = null; roomId = generateRoomCode(); socket.emit('joinRoom', roomId);
        document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('winnerText').innerHTML = `КОД КІМНАТИ:<br><span style="color:#00e5ff">${roomId}</span><br><br><span style="font-size:1.2rem; color:#fff;">ОЧІКУВАННЯ СУПЕРНИКА...</span>`;
        document.getElementById('finalScore').innerText = ""; document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function joinRoom() {
        const input = document.getElementById('roomCodeInput').value.toUpperCase().trim();
        if (input.length < 3) { alert("Введіть коректний код!"); return; }
        initAudio(); myRole = null; roomId = input; socket.emit('joinRoom', roomId);
        document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('winnerText').innerHTML = "ПІДКЛЮЧЕННЯ...";
        document.getElementById('finalScore').innerText = ""; document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function startGame(mode, diff = 'normal') {
        initAudio(); difficulty = diff; myRole = null; p1.isAI = false; p2.isAI = true; 
        document.getElementById('controlsP1').classList.remove('hidden'); document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden'); document.getElementById('btnInGameMenu').classList.remove('hidden'); document.getElementById('btnPause').classList.remove('hidden');
        score = { p1: 0, p2: 0 }; sets = { p1: 0, p2: 0 }; p1.x = p1.startX; p2.x = p2.startX; p1.radius = p1.baseRadius; p2.radius = p2.baseRadius;
        particles = []; ball.reset(1); gameState = 'playing'; playSound('whistle'); 
    }

    function togglePause() {
        if (gameState === 'playing') {
            gameState = 'paused'; document.getElementById('pauseScreen').classList.remove('hidden'); document.getElementById('controlsP1').classList.add('hidden'); document.getElementById('btnPause').classList.add('hidden'); document.getElementById('btnInGameMenu').classList.add('hidden');
        } else if (gameState === 'paused') {
            gameState = 'playing'; document.getElementById('pauseScreen').classList.add('hidden'); document.getElementById('controlsP1').classList.remove('hidden'); document.getElementById('btnPause').classList.remove('hidden'); document.getElementById('btnInGameMenu').classList.remove('hidden'); 
        }
    }

    function checkMatchWin(networkWinner = null) {
        playSound('whistle'); setTimeout(() => playSound('match_win'), 500); tg.HapticFeedback.notificationOccurred('success');
        let text = myRole ? (networkWinner === myRole ? "ВИ ПЕРЕМОГЛИ!" : "СУПЕРНИК ПЕРЕМІГ!") : (sets.p1 >= SETS_TO_WIN_MATCH ? "ВИ ПЕРЕМОГЛИ!" : "ШІ ПЕРЕМІГ!");
        gameState = 'gameover'; document.getElementById('winnerText').innerText = text; document.getElementById('finalScore').innerText = `Сети: ${sets.p1} - ${sets.p2}`;
        document.getElementById('gameOverScreen').classList.remove('hidden'); document.getElementById('controlsP1').classList.add('hidden'); document.getElementById('btnInGameMenu').classList.add('hidden'); document.getElementById('btnPause').classList.add('hidden');
    }

    function returnToMenu() {
        gameState = 'menu';
        document.getElementById('gameOverScreen').classList.add('hidden'); document.getElementById('pauseScreen').classList.add('hidden');
        document.getElementById('btnInGameMenu').classList.add('hidden'); document.getElementById('btnPause').classList.add('hidden'); document.getElementById('controlsP1').classList.add('hidden');
        document.getElementById('diffMenuBtns').classList.add('hidden'); document.getElementById('onlineMenuBtns').classList.add('hidden'); document.getElementById('joinMenuBtns').classList.add('hidden');
        document.getElementById('mainMenuBtns').classList.remove('hidden'); document.getElementById('menuScreen').classList.remove('hidden');
    }

    function drawScore() {
        ctx.font = '900 50px Courier New'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; 
        ctx.shadowBlur = 10; ctx.shadowColor = '#00e5ff';
        ctx.fillText(`${score.p1} - ${score.p2}`, canvas.width / 2, 70);
        ctx.font = 'bold 20px Courier New'; ctx.fillStyle = '#ffea00'; 
        ctx.fillText(`СЕТИ: ${sets.p1} - ${sets.p2}`, canvas.width / 2, 30);
        ctx.shadowBlur = 0;
    }
    
    function drawNet() {
        ctx.fillStyle = '#00e5ff'; ctx.shadowBlur = 20; ctx.shadowColor = '#00e5ff'; ctx.fillRect(net.x, net.y, net.width, net.height);
        ctx.beginPath(); ctx.arc(net.x + net.width/2, net.y, net.width/2, 0, Math.PI * 2); ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.1; 
        let timeScale = dt * 60; 
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState === 'playing') {
            let activePlayer = (myRole === 'p2') ? p2 : p1; 
            if (keys.a) activePlayer.vx = -activePlayer.speed; else if (keys.d) activePlayer.vx = activePlayer.speed; else activePlayer.vx = 0;
            
            p1.update(ball, myRole !== 'p2', timeScale); 
            p2.update(ball, myRole === 'p2' || p2.isAI, timeScale); 
            
            let isHost = (myRole !== 'p2'); ball.update(p1, p2, isHost, timeScale);

            if (myRole) { socket.emit('playerMoved', { roomId: roomId, role: myRole, x: activePlayer.x, y: activePlayer.y, tilt: activePlayer.tilt, squash: activePlayer.squash, stretch: activePlayer.stretch }); }
            if (myRole === 'p1') socket.emit('ballSync', { roomId: roomId, x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy });

            for(let i=particles.length-1; i>=0; i--) { particles[i].update(timeScale); if(particles[i].life <= 0) particles.splice(i, 1); }
        }
        
        if (gameState !== 'menu') { 
            ctx.save();
            if (shakeFrames > 0) { ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12); shakeFrames--; }
            particles.forEach(p => p.draw()); drawNet(); p1.draw(); p2.draw(); ball.draw(); drawScore(); 
            ctx.restore();
        }
        
        requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
</script>
